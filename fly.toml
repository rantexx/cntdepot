# Fly.io app for the cloud version of depotd (Part 0b).
# Secrets are set with `fly secrets set`, never written here:
#   DATABASE_URL           depot_app connection URL (used by `api`)
#   DATABASE_OWNER_URL     owner connection URL (used only by the release `migrate`)
#   DATABASE_APP_PASSWORD  password migrate gives the depot_app role
#   GEMINI_API_KEY         OCR engine key
#   PUBLIC_HOST            the domain name(s) the app is reached by
#   PLATFORM_ADMIN_EMAIL   the product owner's email (made platform admin by migrate)
app = "cntdepot"
primary_region = "fra"

[build]

[deploy]
  release_command = "migrate"

# Photos, until they move to object storage (R2).
[mounts]
  source = "depot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
