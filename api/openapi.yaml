openapi: 3.0.3
info:
  title: depotd API
  version: 0.1.0
  description: |
    The hub API. Hand-written outside this spec: GET /api/stream, GET /api/blobs/{digest},
    /api/camera*, /api/live/ws, /auth/*. Every error is {"error": {"code", "message"}}.
    The stream sends "move" events to the company's screens and "approval" events to its managers.

    JSON bodies are at most 64 KiB: a larger one is 413 E4130.

    Gate and yard errors: 400 E4000 a value is not allowed (the message names the field); 400 E4008
    a required field is empty; 404 E4043 no such record; 409 E4090 choose a depot first; 409 E4098
    refused; 409 E4099 blocked; 409 E4100 the container is in the yard again under a newer visit;
    409 E4101 a correction cannot change the direction; 409 E4102 the move is void; 409 E4103 the
    move has no saved gate form; 409 E4104 the visit the move opened is closed since; 409 E4105 the
    order is not open; 409 E4106 the move's gate form is saved; 422 E4221 a linked record (photo, order item, approval, line, customer,
    haulier) does not exist or does not belong to this move or depot.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
  /api/moves:
    post:
      operationId: createMove
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateMoveRequest"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Move"}}}}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listMoves
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: before, in: query, schema: {type: string}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [moves]
                properties:
                  moves: {type: array, items: {$ref: "#/components/schemas/Move"}}
        default: {$ref: "#/components/responses/Error"}
  /api/moves/{id}:
    get:
      operationId: getMove
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/MoveDetail"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/moves/{id}/photos:
    post:
      operationId: addPhoto
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [original, ai]
              properties:
                role: {type: string}
                width: {type: integer}
                height: {type: integer}
                original: {type: string, format: binary, description: the photo as uploaded}
                ai: {type: string, format: binary, description: the downscaled copy for reading}
      responses:
        "202": {description: accepted, content: {application/json: {schema: {$ref: "#/components/schemas/Photo"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/moves/{id}/resolve:
    post:
      operationId: resolveMove
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ResolveRequest"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Move"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/moves/{id}/reread:
    post:
      operationId: rereadMove
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "202": {description: accepted, content: {application/json: {schema: {$ref: "#/components/schemas/Move"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/moves/{id}/number:
    post:
      operationId: enterNumber
      description: Manual entry of the container number by the clerk.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number]
              properties: {number: {type: string}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Move"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/validate/{number}:
    get:
      operationId: validateNumber
      parameters: [{name: number, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Validation"}}}}
  /api/test-read:
    post:
      operationId: testRead
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ai]
              properties:
                ai: {type: string, format: binary}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/TestReadResult"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/session:
    get:
      operationId: getSession
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/session/scope:
    post:
      operationId: setScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, depotId]
              properties: {companyId: {type: string}, depotId: {type: string}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/session/logout:
    post:
      operationId: logout
      responses:
        "204": {description: signed out}
        default: {$ref: "#/components/responses/Error"}
  /api/company:
    get:
      operationId: getCompany
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Company"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/company/modules:
    patch:
      operationId: setModules
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modules]
              properties: {modules: {type: array, items: {type: string}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Company"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/depots:
    get:
      operationId: listDepots
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Depot"}}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createDepot
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, country, timezone]
              properties: {name: {type: string}, country: {type: string}, timezone: {type: string}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Depot"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/members:
    get:
      operationId: listMembers
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Member"}}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/members/{userId}:
    patch:
      operationId: updateMember
      description: Owner only.
      parameters: [{name: userId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/MemberUpdate"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Member"}}}}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeMember
      description: Owner only.
      parameters: [{name: userId, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: removed}
        default: {$ref: "#/components/responses/Error"}
  /api/invitations:
    get:
      operationId: listInvitations
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Invitation"}}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createInvitation
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role, depotIds]
              properties:
                email: {type: string}
                role: {$ref: "#/components/schemas/Role"}
                depotIds: {$ref: "#/components/schemas/DepotIds"}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Invitation"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/invitations/{id}:
    delete:
      operationId: deleteInvitation
      description: Owner only.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: deleted}
        default: {$ref: "#/components/responses/Error"}
  /api/ref/liners:
    get:
      operationId: searchLiners
      parameters: [{name: q, in: query, schema: {type: string}}]
      responses:
        "200": {description: at most 20 results, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Liner"}}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/ref/locodes:
    get:
      operationId: searchLocodes
      parameters: [{name: q, in: query, schema: {type: string}}]
      responses:
        "200": {description: at most 20 results, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Locode"}}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/platform/companies:
    get:
      operationId: listCompanies
      description: Platform admins only.
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Company"}}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createCompany
      description: Platform admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, country, ownerEmail, modules]
              properties:
                name: {type: string}
                country: {type: string}
                ownerEmail: {type: string}
                modules: {type: array, items: {type: string}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Company"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/lines:
    get:
      operationId: listLines
      parameters: [{$ref: "#/components/parameters/Q"}, {$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PerPage"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/LineList"}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createLine
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LineCreate"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Line"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/lines/{id}:
    patch:
      operationId: updateLine
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LinePatch"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Line"}}}}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deactivateLine
      description: Sets active=false; the row is kept.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: deactivated}
        default: {$ref: "#/components/responses/Error"}
  /api/customers:
    get:
      operationId: listCustomers
      parameters: [{$ref: "#/components/parameters/Q"}, {$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PerPage"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/CustomerList"}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createCustomer
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CustomerCreate"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Customer"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/customers/{id}:
    patch:
      operationId: updateCustomer
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CustomerPatch"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Customer"}}}}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deactivateCustomer
      description: Sets active=false; the row is kept.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: deactivated}
        default: {$ref: "#/components/responses/Error"}
  /api/hauliers:
    get:
      operationId: listHauliers
      parameters: [{$ref: "#/components/parameters/Q"}, {$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PerPage"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/HaulierList"}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createHaulier
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/HaulierCreate"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Haulier"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/hauliers/{id}:
    patch:
      operationId: updateHaulier
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/HaulierPatch"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Haulier"}}}}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deactivateHaulier
      description: Sets active=false; the row is kept.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: deactivated}
        default: {$ref: "#/components/responses/Error"}
  /api/moves/{id}/gate:
    post:
      operationId: saveGateForm
      description: |
        Saves the clerk's gate form on the move (gate role). A resend of a saved form returns the stored result.
        409 E4098: refused (refusals, and approvalId/approvalStatus under manager_approval, or candidates when
        several order items match and the clerk must choose one); 409 E4099: blocked, never passable at the gate.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/GateForm"}}}
      responses:
        "200": {description: saved, content: {application/json: {schema: {$ref: "#/components/schemas/GateResult"}}}}
        "409": {description: refused or blocked, content: {application/json: {schema: {$ref: "#/components/schemas/GateRefusal"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/moves/{id}/form:
    get:
      operationId: getMoveForm
      description: The move's gate form as saved (formSavedAt is null before the first save), its damages and flags.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/MoveForm"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/moves/{id}/eir:
    post:
      operationId: createEirLink
      description: A shareable EIR link for the move. The token in the url is shown only once.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/EirLink"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/moves/{id}/correct:
    post:
      operationId: correctMove
      description: |
        Office: rewrites a saved gate form. Refusals do not stop a correction (they become flags with the reason).
        409 E4098 with candidates when several order items match; 409 E4100 the container has a newer visit;
        409 E4101 the direction cannot change; 409 E4102 the move is void; 409 E4103 the move has no saved form;
        409 E4104 the visit this move opened is closed.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, form]
              properties:
                reason: {type: string, maxLength: 500}
                form: {$ref: "#/components/schemas/GateForm"}
      responses:
        "200": {description: corrected, content: {application/json: {schema: {$ref: "#/components/schemas/GateResult"}}}}
        "409": {description: choose an order item, content: {application/json: {schema: {$ref: "#/components/schemas/GateRefusal"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/moves/{id}/void:
    post:
      operationId: voidMove
      description: Office. 409 E4100, E4102 or E4104 as for correctMove.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ReasonBody"}}}
      responses:
        "204": {description: voided}
        default: {$ref: "#/components/responses/Error"}
  /api/moves/{id}/turn-away:
    post:
      operationId: turnAwayMove
      description: >-
        Gate. The truck was turned away: the move keeps the typed number, is void ("turned away") and gets a
        turned_away flag with the refusal codes for the office. A repeat is a no-op. 409 E4106 when the move's
        gate form is saved; 409 E4102 when the office voided it.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TurnAway"}}}
      responses:
        "204": {description: turned away}
        default: {$ref: "#/components/responses/Error"}
  /api/gate/snapshot:
    get:
      operationId: gateSnapshot
      description: What a gate phone keeps for working offline. Needs a depot in the scope (409 E4090).
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/GateSnapshot"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/orders:
    get:
      operationId: listOrders
      parameters:
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/OrderKind"}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/OrderStatus"}}
        - {$ref: "#/components/parameters/Q"}
      responses:
        "200": {description: newest first, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Order"}}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createOrder
      description: Needs a depot in the scope. An item names a container or a quantity of an ISO type, not both.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/OrderCreate"}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/OrderDetail"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/orders/{id}:
    get:
      operationId: getOrder
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/OrderDetail"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/orders/{id}/cancel:
    post:
      operationId: cancelOrder
      description: 409 E4105 when the order is not open.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: cancelled}
        default: {$ref: "#/components/responses/Error"}
  /api/visits:
    get:
      operationId: listVisits
      parameters:
        - {name: status, in: query, schema: {$ref: "#/components/schemas/VisitStatus"}}
        - {name: q, in: query, description: container number contains (spaces and case ignored), schema: {type: string}}
        - {name: lineId, in: query, schema: {type: string}}
        - {name: customerId, in: query, schema: {type: string}}
        - {name: type, in: query, description: ISO type code prefix, schema: {type: string}}
        - {name: grade, in: query, schema: {type: string}}
        - {name: hold, in: query, description: true lists only visits with an open hold, schema: {type: boolean}}
        - {name: minDays, in: query, description: at least this many days in the yard, schema: {type: integer, minimum: 0}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PerPage"}
      responses:
        "200": {description: newest first, content: {application/json: {schema: {$ref: "#/components/schemas/VisitList"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/visits/{id}:
    get:
      operationId: getVisit
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/VisitDetail"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/visits/{id}/position:
    patch:
      operationId: setVisitPosition
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [block, row, tier]
              properties: {block: {type: string, maxLength: 64}, row: {type: string, maxLength: 64}, tier: {type: string, maxLength: 64}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Visit"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/visits/{id}/grade:
    patch:
      operationId: setVisitGrade
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grade]
              properties: {grade: {type: string, description: "one of '', A, B, C, FOOD"}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Visit"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/visits/{id}/holds:
    post:
      operationId: placeHold
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ReasonBody"}}}
      responses:
        "201": {description: placed, content: {application/json: {schema: {$ref: "#/components/schemas/Hold"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/holds/{id}/release:
    post:
      operationId: releaseHold
      description: 404 when the hold is already released.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: released}
        default: {$ref: "#/components/responses/Error"}
  /api/blocks:
    get:
      operationId: listBlocks
      description: The company's block list, inactive entries included.
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Block"}}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createBlock
      description: Adds an entry, or re-activates the same kind and value with the new reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value, reason]
              properties: {kind: {$ref: "#/components/schemas/BlockKind"}, value: {type: string, maxLength: 64}, reason: {type: string, maxLength: 500}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Block"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/blocks/{id}:
    patch:
      operationId: setBlockActive
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties: {active: {type: boolean}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Block"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/approvals:
    get:
      operationId: listApprovals
      description: Managers. Oldest first.
      parameters: [{name: status, in: query, schema: {type: string, enum: [pending, approved, denied]}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Approval"}}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/approvals/{id}:
    post:
      operationId: decideApproval
      description: Managers. 404 when the approval is already decided.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties: {approve: {type: boolean}}
      responses:
        "204": {description: decided}
        default: {$ref: "#/components/responses/Error"}
  /api/gate-flags:
    get:
      operationId: listGateFlags
      parameters:
        - {name: open, in: query, description: true lists only unresolved flags, schema: {type: boolean}}
        - {name: moveId, in: query, schema: {type: string}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/GateFlag"}}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/gate-flags/{id}/resolve:
    post:
      operationId: resolveGateFlag
      description: The office may leave a note on what it did. 404 when the flag is already resolved.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {note: {type: string, maxLength: 500}}
      responses:
        "204": {description: resolved}
        default: {$ref: "#/components/responses/Error"}
  /api/settings/yard:
    get:
      operationId: getYardSettings
      description: Managers and owners.
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/YardSettings"}}}}
        default: {$ref: "#/components/responses/Error"}
    put:
      operationId: setYardSettings
      description: Owner only.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/YardSettings"}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/YardSettings"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/reports/dashboard:
    get:
      operationId: reportDashboard
      description: Today's gate moves (in the depot's own calendar day), the yard by line, open holds and open gate flags, for the session's depot (every depot of the company when none is chosen).
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Dashboard"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/reports/ageing:
    get:
      operationId: reportAgeing
      description: In-yard containers by whole days in the yard, per line, in the buckets 0-7, 8-30, 31-90 and 90+.
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AgeingRow"}}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/reports/gate-log:
    get:
      operationId: gateLog
      description: Saved gate forms, newest first, at most 5000. from and to are depot-local dates, both inclusive.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/GateLogRow"}}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/import/stock:
    post:
      operationId: importStock
      description: |
        Opening stock from a CSV file (at most 5 MiB and 20000 rows; ',' or ';' separated; dates YYYY-MM-DD or DD.MM.YYYY).
        Needs a chosen depot. All or nothing: any bad row rejects the whole file with 422 E4220.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200": {description: imported, content: {application/json: {schema: {$ref: "#/components/schemas/ImportResult"}}}}
        "422": {description: a bad row; nothing was imported, content: {application/json: {schema: {$ref: "#/components/schemas/ImportRejected"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/import/orders:
    post:
      operationId: importOrders
      description: Release and redelivery orders from a CSV file, one row per item; rows with the same kind and reference are one order. Same limits and all-or-nothing rule as the stock import.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200": {description: imported, content: {application/json: {schema: {$ref: "#/components/schemas/ImportResult"}}}}
        "422": {description: a bad row; nothing was imported, content: {application/json: {schema: {$ref: "#/components/schemas/ImportRejected"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/import/templates/{name}:
    get:
      operationId: importTemplate
      description: An import file's header row and one example row (UTF-8 with BOM). The name is stock.csv or orders.csv.
      parameters:
        - {name: name, in: path, required: true, schema: {type: string, enum: [stock.csv, orders.csv]}}
      responses:
        "200":
          description: ok
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            text/csv: {schema: {type: string, format: binary}}
        default: {$ref: "#/components/responses/Error"}
components:
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
    Q: {name: q, in: query, schema: {type: string}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1}}
    PerPage: {name: perPage, in: query, schema: {type: integer, minimum: 1}}
  responses:
    Error:
      description: error
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
  schemas:
    LineCount:
      type: object
      required: [lineId, lineCode, count]
      properties: {lineId: {type: string}, lineCode: {type: string}, count: {type: integer}}
    Dashboard:
      type: object
      required: [inToday, outToday, inYardByLine, openHolds, openFlags]
      properties:
        inToday: {type: integer}
        outToday: {type: integer}
        inYardByLine: {type: array, items: {$ref: "#/components/schemas/LineCount"}}
        openHolds: {type: integer}
        openFlags: {type: integer}
    AgeingRow:
      type: object
      description: One line (lineId and lineCode are empty for containers without a line).
      required: [lineId, lineCode, total, buckets]
      properties:
        lineId: {type: string}
        lineCode: {type: string}
        total: {type: integer}
        buckets: {type: object, description: "keys 0-7, 8-30, 31-90, 90+", additionalProperties: {type: integer}}
    GateLogRow:
      type: object
      required: [id, depotId, direction, number, typeCode, at, truckPlate, trailerPlate, driverName, seal, fullEmpty, condition, voided, lineCode, customerCode, haulierCode, flags]
      properties:
        id: {type: string}
        depotId: {type: string}
        direction: {type: string}
        number: {type: string}
        typeCode: {type: string}
        at: {type: string, format: date-time}
        truckPlate: {type: string}
        trailerPlate: {type: string}
        driverName: {type: string}
        seal: {type: string}
        fullEmpty: {type: string}
        condition: {type: string}
        voided: {type: boolean}
        lineCode: {type: string}
        customerCode: {type: string}
        haulierCode: {type: string}
        flags: {type: integer}
    ImportResult:
      type: object
      required: [imported]
      properties: {imported: {type: integer, description: visits (stock) or orders (orders) created}}
    ImportRowError:
      type: object
      required: [row, field, message]
      properties:
        row: {type: integer, description: "1-based data row, header excluded; 0 for the header"}
        field: {type: string}
        message: {type: string}
    ImportRejected:
      type: object
      required: [error, rows]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}}
        rows: {type: array, description: at most 200 problems, items: {$ref: "#/components/schemas/ImportRowError"}}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}}
    Role: {type: string, enum: [owner, manager, office, gate]}
    Status: {type: string, enum: [capturing, reading, needs_review, accepted, refused, no_container]}
    Health:
      type: object
      required: [ok, version, engine, model, auth_required]
      properties:
        ok: {type: boolean}
        version: {type: string}
        engine: {type: string}
        model: {type: string}
        auth_required: {type: boolean}
    CreateMoveRequest:
      type: object
      properties:
        lane: {type: string, maxLength: 32}
        is_test: {type: boolean}
        id: {type: string, maxLength: 64, description: "the phone outbox's own id (16-64 of A-Z a-z 0-9 - _); a resend returns the stored move"}
    ResolveRequest:
      type: object
      required: [action, by]
      properties:
        action: {type: string, enum: [accept, correct, refuse]}
        number: {type: string}
        by: {type: string}
        note: {type: string}
    Photo:
      type: object
      required: [id, depot_id, move_id, role, sha256, ai_sha256, media_type, ai_media_type, bytes, width, height, captured_at, deferred, read_enabled]
      properties:
        id: {type: string}
        depot_id: {type: string}
        move_id: {type: string}
        role: {type: string}
        sha256: {type: string}
        ai_sha256: {type: string}
        media_type: {type: string}
        ai_media_type: {type: string}
        bytes: {type: integer, format: int64}
        width: {type: integer}
        height: {type: integer}
        captured_at: {type: string, format: date-time}
        deferred: {type: boolean}
        read_enabled: {type: boolean}
    Candidate:
      type: object
      required: [number, confidence, check_digit_valid]
      properties:
        number: {type: string}
        confidence: {type: number}
        check_digit_valid: {type: boolean}
        repaired_from: {type: string}
    Frame:
      type: object
      required: [role, candidates, type_code, color, visible, notes]
      properties:
        role: {type: string}
        candidates: {type: array, nullable: true, items: {$ref: "#/components/schemas/Candidate"}}
        type_code: {type: string}
        color: {type: string}
        visible: {type: string}
        notes: {type: string}
        error: {type: string}
    Result:
      type: object
      properties:
        number: {type: string}
        confidence: {type: number}
        check_digit_valid: {type: boolean}
        decision: {type: string}
        reason: {type: string}
        type_code: {type: string}
        color: {type: string}
        candidates: {type: array, nullable: true, items: {$ref: "#/components/schemas/Candidate"}}
        frames: {type: array, nullable: true, items: {$ref: "#/components/schemas/Frame"}}
    Box:
      type: object
      required: [x0, y0, x1, y1]
      properties: {x0: {type: number}, y0: {type: number}, x1: {type: number}, y1: {type: number}}
    Reading:
      type: object
      properties:
        candidates:
          type: array
          nullable: true
          items:
            type: object
            required: [number, confidence]
            properties: {number: {type: string}, confidence: {type: number}}
        type_code: {type: string}
        color: {type: string}
        visible: {type: string}
        box: {nullable: true, allOf: [{$ref: "#/components/schemas/Box"}]}
        notes: {type: string}
    Move:
      type: object
      required: [id, lane, direction, source, status, number, type_code, color, confidence, check_digit_valid, decision, reason, result, verified, corrected_from, resolved_by, note, is_test, created_at, updated_at, photos]
      properties:
        id: {type: string}
        lane: {type: string}
        direction: {type: string}
        source: {type: string, enum: [phone, camera]}
        status: {$ref: "#/components/schemas/Status"}
        number: {type: string}
        type_code: {type: string}
        color: {type: string}
        confidence: {type: number}
        check_digit_valid: {type: boolean}
        decision: {type: string}
        reason: {type: string}
        result: {$ref: "#/components/schemas/Result"}
        verified: {type: boolean}
        corrected_from: {type: string}
        resolved_by: {type: string}
        note: {type: string}
        is_test: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        photos: {type: array, nullable: true, items: {$ref: "#/components/schemas/Photo"}}
    Attempt:
      type: object
      required: [id, move_id, photo_id, engine, model, prompt_version, reading, raw, error, input_tokens, output_tokens, latency_ms, created_at]
      properties:
        id: {type: string}
        move_id: {type: string}
        photo_id: {type: string}
        engine: {type: string}
        model: {type: string}
        prompt_version: {type: string}
        reading: {$ref: "#/components/schemas/Reading"}
        raw: {type: string}
        error: {type: string}
        input_tokens: {type: integer, format: int64}
        output_tokens: {type: integer, format: int64}
        latency_ms: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
    MoveDetail:
      allOf:
        - $ref: "#/components/schemas/Move"
        - type: object
          required: [attempts]
          properties:
            attempts: {type: array, nullable: true, items: {$ref: "#/components/schemas/Attempt"}}
    Step:
      type: object
      required: [char, value, weight, product]
      properties: {char: {type: string}, value: {type: integer}, weight: {type: integer}, product: {type: integer}}
    Validation:
      type: object
      required: [input, normalized, well_formed, check_digit_valid, expected_check_digit, valid, sum, remainder]
      properties:
        input: {type: string}
        normalized: {type: string}
        well_formed: {type: boolean}
        check_digit_valid: {type: boolean}
        expected_check_digit: {type: integer, nullable: true}
        valid: {type: boolean}
        steps: {type: array, items: {$ref: "#/components/schemas/Step"}}
        sum: {type: integer}
        remainder: {type: integer}
    TestReadResult:
      type: object
      required: [attempt, frame]
      properties:
        attempt:
          type: object
          required: [engine, model, prompt_version, reading, raw, usage, latency_ms]
          properties:
            engine: {type: string}
            model: {type: string}
            prompt_version: {type: string}
            reading: {$ref: "#/components/schemas/Reading"}
            raw: {type: string}
            usage:
              type: object
              required: [input_tokens, output_tokens]
              properties: {input_tokens: {type: integer}, output_tokens: {type: integer}}
            latency_ms: {type: integer, format: int64}
        frame: {$ref: "#/components/schemas/Frame"}
        error: {type: string}
    Session:
      type: object
      required: [user, companies, platformAdmin]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties: {id: {type: string}, email: {type: string}, name: {type: string}}
        companies:
          type: array
          items:
            type: object
            required: [id, name, role, depots]
            properties:
              id: {type: string}
              name: {type: string}
              role: {$ref: "#/components/schemas/Role"}
              depots:
                description: The depots this member may use (all of the company's depots when the membership is not limited).
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties: {id: {type: string}, name: {type: string}}
        platformAdmin: {type: boolean}
        current:
          description: Present only when a scope (company and depot) is set.
          type: object
          required: [companyId, depotId, role, modules, permissions]
          properties:
            companyId: {type: string}
            depotId: {type: string, nullable: true, description: null means all depots}
            role: {$ref: "#/components/schemas/Role"}
            modules: {type: array, items: {type: string}}
            permissions: {type: array, items: {type: string}}
    Company:
      type: object
      required: [id, name, country, modules]
      properties:
        id: {type: string}
        name: {type: string}
        country: {type: string}
        modules: {type: array, items: {type: string}}
    Depot:
      type: object
      required: [id, name, country, timezone]
      properties: {id: {type: string}, name: {type: string}, country: {type: string}, timezone: {type: string}}
    DepotIds:
      type: array
      nullable: true
      minItems: 1
      items: {type: string}
      description: Depots the member or invitee may use. null means all depots; when set, at least one id.
    Member:
      type: object
      required: [userId, email, name, role, depotIds]
      properties:
        userId: {type: string}
        email: {type: string}
        name: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        depotIds: {$ref: "#/components/schemas/DepotIds"}
    MemberUpdate:
      type: object
      required: [role, depotIds]
      properties:
        role: {$ref: "#/components/schemas/Role"}
        depotIds: {$ref: "#/components/schemas/DepotIds"}
    Invitation:
      type: object
      required: [id, email, role, depotIds, createdAt]
      properties:
        id: {type: string}
        email: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        depotIds: {$ref: "#/components/schemas/DepotIds"}
        createdAt: {type: string, format: date-time}
    Liner:
      type: object
      required: [code, name]
      properties: {code: {type: string}, name: {type: string}}
    Locode:
      type: object
      required: [code, name, country]
      properties: {code: {type: string}, name: {type: string}, country: {type: string}}
    Line:
      type: object
      required: [id, code, name, contact, active]
      properties: {id: {type: string}, code: {type: string}, name: {type: string}, contact: {type: string}, active: {type: boolean}}
    LineCreate:
      type: object
      required: [code, name]
      properties: {code: {type: string}, name: {type: string}, contact: {type: string}}
    LinePatch:
      type: object
      properties: {code: {type: string}, name: {type: string}, contact: {type: string}, active: {type: boolean}}
    LineList:
      type: object
      required: [items, total]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Line"}}, total: {type: integer}}
    Customer:
      type: object
      required: [id, code, name, contact, active]
      properties: {id: {type: string}, code: {type: string}, name: {type: string}, contact: {type: string}, active: {type: boolean}}
    CustomerCreate:
      type: object
      required: [code, name]
      properties: {code: {type: string}, name: {type: string}, contact: {type: string}}
    CustomerPatch:
      type: object
      properties: {code: {type: string}, name: {type: string}, contact: {type: string}, active: {type: boolean}}
    CustomerList:
      type: object
      required: [items, total]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Customer"}}, total: {type: integer}}
    Haulier:
      type: object
      required: [id, code, name, contact, active]
      properties: {id: {type: string}, code: {type: string}, name: {type: string}, contact: {type: string}, active: {type: boolean}}
    HaulierCreate:
      type: object
      required: [code, name]
      properties: {code: {type: string}, name: {type: string}, contact: {type: string}}
    HaulierPatch:
      type: object
      properties: {code: {type: string}, name: {type: string}, contact: {type: string}, active: {type: boolean}}
    HaulierList:
      type: object
      required: [items, total]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Haulier"}}, total: {type: integer}}
    Reason:
      type: object
      required: [code]
      properties: {code: {type: string}, detail: {type: string}}
    TurnAway:
      type: object
      required: [number, reasons]
      properties:
        number: {type: string, maxLength: 64}
        reasons:
          type: array
          maxItems: 20
          items:
            type: object
            required: [code]
            properties: {code: {type: string, maxLength: 64}, detail: {type: string, maxLength: 500}}
    ReasonBody:
      type: object
      required: [reason]
      properties: {reason: {type: string, maxLength: 500}}
    GateForm:
      type: object
      required: [direction, number]
      properties:
        direction: {type: string, enum: [in, out]}
        number: {type: string, maxLength: 64}
        typeCode: {type: string, maxLength: 64}
        fullEmpty: {type: string, maxLength: 64, description: "E or F; empty means E"}
        seal: {type: string, maxLength: 64}
        condition: {type: string, maxLength: 64, description: "sound, damaged or empty"}
        lineId: {type: string, maxLength: 64}
        customerId: {type: string, maxLength: 64}
        haulierId: {type: string, maxLength: 64}
        truckPlate: {type: string, maxLength: 64}
        trailerPlate: {type: string, maxLength: 64}
        driverName: {type: string, maxLength: 200}
        signaturePhotoId: {type: string, maxLength: 64}
        damages:
          type: array
          items:
            type: object
            required: [location, photoIds]
            properties:
              location: {type: string, maxLength: 500}
              description: {type: string, maxLength: 500}
              photoIds: {type: array, minItems: 1, maxItems: 3, description: photos of this move, items: {type: string, maxLength: 64}}
        chosenOrderItemId: {type: string, maxLength: 64, description: the clerk's pick among the candidates of a 409 E4098}
        override:
          type: object
          required: [reason]
          description: The clerk passes the refusals with a reason (refusal mode clerk_override).
          properties: {reason: {type: string, maxLength: 500}}
        approvalId: {type: string, maxLength: 64, description: the manager approval of a 409 E4098 (refusal mode manager_approval)}
    GateResult:
      type: object
      required: [move, visitId, flags]
      properties:
        move: {$ref: "#/components/schemas/Move"}
        visitId: {type: string}
        flags: {type: array, items: {$ref: "#/components/schemas/Reason"}}
    OrderCandidate:
      type: object
      required: [orderId, itemId, number, typeCode, fullEmpty, remaining]
      properties:
        orderId: {type: string}
        itemId: {type: string}
        number: {type: string}
        typeCode: {type: string}
        fullEmpty: {type: string}
        remaining: {type: integer}
    GateRefusal:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [refusals]
          properties:
            refusals: {type: array, items: {$ref: "#/components/schemas/Reason"}}
            approvalId: {type: string}
            approvalStatus: {type: string, description: pending or denied}
            candidates: {type: array, items: {$ref: "#/components/schemas/OrderCandidate"}}
    EirLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: {type: string, description: "relative: /eir/{token}"}
        expiresAt: {type: string, format: date-time}
    OrderKind: {type: string, enum: [release, redelivery]}
    OrderStatus: {type: string, enum: [open, done, cancelled]}
    Order:
      type: object
      required: [id, depotId, kind, reference, lineId, customerId, validUntil, note, status, createdBy, createdAt]
      properties:
        id: {type: string}
        depotId: {type: string}
        kind: {$ref: "#/components/schemas/OrderKind"}
        reference: {type: string}
        lineId: {type: string, nullable: true}
        customerId: {type: string, nullable: true}
        validUntil: {type: string, format: date, nullable: true}
        note: {type: string}
        status: {$ref: "#/components/schemas/OrderStatus"}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
    OrderItem:
      type: object
      required: [id, orderId, number, typeCode, fullEmpty, quantity, used]
      properties:
        id: {type: string}
        orderId: {type: string}
        number: {type: string, nullable: true}
        typeCode: {type: string, nullable: true}
        fullEmpty: {type: string}
        quantity: {type: integer}
        used: {type: integer}
    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [items]
          properties: {items: {type: array, items: {$ref: "#/components/schemas/OrderItem"}}}
    OrderCreate:
      type: object
      required: [kind, reference, items]
      properties:
        kind: {$ref: "#/components/schemas/OrderKind"}
        reference: {type: string, maxLength: 64}
        lineId: {type: string, maxLength: 64}
        customerId: {type: string, maxLength: 64}
        validUntil: {type: string, format: date}
        note: {type: string, maxLength: 500}
        items:
          type: array
          minItems: 1
          items:
            type: object
            description: A container number (quantity 1) or an ISO type with a quantity, exactly one of the two.
            properties:
              number: {type: string, maxLength: 64}
              typeCode: {type: string, maxLength: 64}
              fullEmpty: {type: string, maxLength: 64, description: "E or F; empty means E"}
              quantity: {type: integer, minimum: 1, description: default 1}
    VisitStatus: {type: string, enum: [in_yard, out]}
    Visit:
      type: object
      required: [id, depotId, number, typeCode, lineId, customerId, status, fullEmpty, grade, block, rowNo, tier, inMoveId, outMoveId, inAt, outAt, imported, closeReason]
      properties:
        id: {type: string}
        depotId: {type: string}
        number: {type: string}
        typeCode: {type: string}
        lineId: {type: string, nullable: true}
        customerId: {type: string, nullable: true}
        status: {$ref: "#/components/schemas/VisitStatus"}
        fullEmpty: {type: string}
        grade: {type: string}
        block: {type: string}
        rowNo: {type: string}
        tier: {type: string}
        inMoveId: {type: string, nullable: true}
        outMoveId: {type: string, nullable: true}
        inAt: {type: string, format: date-time}
        outAt: {type: string, format: date-time, nullable: true}
        imported: {type: boolean}
        closeReason: {type: string}
    VisitListItem:
      allOf:
        - $ref: "#/components/schemas/Visit"
        - type: object
          required: [onHold]
          properties: {onHold: {type: boolean}}
    VisitList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/VisitListItem"}}
        total: {type: integer}
    VisitDetail:
      allOf:
        - $ref: "#/components/schemas/Visit"
        - type: object
          required: [holds, inForm, outForm]
          properties:
            holds: {type: array, items: {$ref: "#/components/schemas/Hold"}}
            inForm: {nullable: true, description: the gate-in move's form; null when none or at another depot, allOf: [{$ref: "#/components/schemas/MoveForm"}]}
            outForm: {nullable: true, description: the gate-out move's form; null when none or at another depot, allOf: [{$ref: "#/components/schemas/MoveForm"}]}
    Hold:
      type: object
      required: [id, visitId, reason, placedBy, placedAt, releasedBy, releasedAt]
      properties:
        id: {type: string}
        visitId: {type: string}
        reason: {type: string}
        placedBy: {type: string}
        placedAt: {type: string, format: date-time}
        releasedBy: {type: string}
        releasedAt: {type: string, format: date-time, nullable: true}
    BlockKind: {type: string, enum: [container, line]}
    Block:
      type: object
      required: [id, kind, value, reason, active, createdBy, createdAt]
      properties:
        id: {type: string}
        kind: {$ref: "#/components/schemas/BlockKind"}
        value: {type: string}
        reason: {type: string}
        active: {type: boolean}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
    Approval:
      type: object
      required: [id, moveId, number, reasons, requestedBy, requestedAt, status, decidedBy, decidedAt]
      properties:
        id: {type: string}
        moveId: {type: string}
        number: {type: string, description: the move's container number}
        reasons: {type: array, items: {$ref: "#/components/schemas/Reason"}}
        requestedBy: {type: string}
        requestedAt: {type: string, format: date-time}
        status: {type: string, description: "pending, approved or denied"}
        decidedBy: {type: string}
        decidedAt: {type: string, format: date-time, nullable: true}
    GateFlag:
      type: object
      required: [id, moveId, code, detail, resolvedBy, resolvedAt, resolveNote]
      properties:
        id: {type: string}
        moveId: {type: string}
        code: {type: string}
        detail: {type: string}
        resolvedBy: {type: string}
        resolveNote: {type: string}
        resolvedAt: {type: string, format: date-time, nullable: true}
    YardSettings:
      type: object
      required: [refusalMode, walkinsAllowed, eirTtlDays]
      properties:
        refusalMode: {type: string, enum: [clerk_override, manager_approval, none]}
        walkinsAllowed: {type: boolean}
        eirTtlDays: {type: integer, minimum: 1}
    LinePrefix:
      type: object
      required: [prefix, lineId]
      properties: {prefix: {type: string}, lineId: {type: string}}
    GateSnapshot:
      type: object
      required: [at, orders, blocks, holds, inYard, linePrefixes, settings]
      properties:
        at: {type: string, format: date-time}
        orders: {type: array, description: the depot's open orders, items: {$ref: "#/components/schemas/OrderDetail"}}
        blocks: {type: array, description: the company's active block list, items: {$ref: "#/components/schemas/Block"}}
        holds: {type: array, description: open holds on the depot's visits, items: {$ref: "#/components/schemas/Hold"}}
        inYard: {type: array, items: {$ref: "#/components/schemas/Visit"}}
        linePrefixes: {type: array, items: {$ref: "#/components/schemas/LinePrefix"}}
        settings: {$ref: "#/components/schemas/YardSettings"}
    MoveForm:
      type: object
      required: [id, direction, number, typeCode, fullEmpty, seal, condition, lineId, customerId, haulierId, truckPlate, trailerPlate, driverName, signaturePhotoId, visitId, orderId, orderItemId, formSavedAt, voided, voidReason, corrections, damages, flags]
      properties:
        id: {type: string, description: the move id}
        direction: {type: string}
        number: {type: string}
        typeCode: {type: string}
        fullEmpty: {type: string}
        seal: {type: string}
        condition: {type: string}
        lineId: {type: string, nullable: true, description: the visit's line}
        customerId: {type: string, nullable: true, description: the visit's customer}
        haulierId: {type: string, nullable: true}
        truckPlate: {type: string}
        trailerPlate: {type: string}
        driverName: {type: string}
        signaturePhotoId: {type: string, nullable: true}
        visitId: {type: string, nullable: true}
        orderId: {type: string, nullable: true}
        orderItemId: {type: string, nullable: true}
        formSavedAt: {type: string, format: date-time, nullable: true}
        voided: {type: boolean}
        voidReason: {type: string}
        corrections: {type: integer, description: how many times the office corrected the form}
        damages:
          type: array
          items:
            type: object
            required: [id, location, description, photoIds]
            properties:
              id: {type: string}
              location: {type: string}
              description: {type: string}
              photoIds: {type: array, items: {type: string}}
        flags: {type: array, items: {$ref: "#/components/schemas/GateFlag"}}
