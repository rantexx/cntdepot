version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: pg_catalog.float4
            go_type: float64
          - db_type: pg_catalog.int4
            go_type: int64
