version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: pg_catalog.int4
            go_type: int64
  # The yard package: nullable columns as Go pointers.
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/yard/queries
    gen:
      go:
        package: db
        out: internal/yard/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: {type: time.Time, pointer: true}
          - db_type: date
            nullable: true
            go_type: {type: time.Time, pointer: true}
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: pg_catalog.int4
            go_type: int64
  # The EDI package, the same settings as yard.
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/edi/queries
    gen:
      go:
        package: db
        out: internal/edi/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: {type: time.Time, pointer: true}
          - db_type: date
            nullable: true
            go_type: {type: time.Time, pointer: true}
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: pg_catalog.int4
            go_type: int64
