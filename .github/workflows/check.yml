name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --prefix web ci
      - run: bash scripts/check.sh
